# .goreleaser.yaml
version: 2

before:
  hooks:
    # 编译前清理一下，并下载依赖
    - go mod tidy

builds:
  - env:
      - CGO_ENABLED=0
    # 👇👇👇 加上这一行，指向你的 main.go 所在的文件夹
    main: ./cmd
    
    # 建议加上这个，指定编译出来的二进制文件名叫 j2y (如果不加，默认是文件夹名)
    binary: j2y
    goos:
      - linux
      - windows
      - darwin # macos
    goarch:
      - amd64
      - arm64 # 支持 M1/M2/M3 芯片

archives:
  - format: tar.gz
    # 这会把所有文件打包成 j2y_1.0.0_linux_amd64.tar.gz 这种格式
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}
    # 如果你有 README.md 或 LICENSE，这里会自动打包进去
    files:
      - README.md
      - LICENSE

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: "{{ incpatch .Version }}-next"

brews:
  -
    # 👇 修改这里：指向你自己
    repository:
      owner: LJTian
      name: j2y  # <--- 以前是 homebrew-tap，现在改成 j2y
      
      # 👇 如果是同一个仓库，用 GITHUB_TOKEN 就可以，不需要 GH_PAT
      token: "{{ .Env.GITHUB_TOKEN }}"

    name: j2y
    homepage: "https://github.com/LJTian/j2y"
    description: "A fast JSON to YAML converter."
    license: "MIT"
    
    # 👇 生成的文件会放在你仓库根目录的 Formula 文件夹下
    directory: Formula 
    
    # 重要：不要每次发布都强制 push 到 default branch，
    # 但 GoReleaser 默认行为就是 commit 到这个仓库。
    # 确保你的 GitHub Actions 有权限写这个仓库。

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
